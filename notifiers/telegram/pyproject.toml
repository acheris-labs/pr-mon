[project]
name = "telegram-webhook"
version = "0.1.0"
description = "Lambda that receives Telegram button taps and queues them in SQS for pr-mon."
requires-python = ">=3.13"

# boto3 ships in the Lambda runtime; it is listed here only so the tests can
# import the handlers locally. Nothing is packaged into the deployment zips.
dependencies = ["boto3>=1.35"]

[tool.uv]
package = false
