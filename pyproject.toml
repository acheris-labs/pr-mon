[project]
name = "pr-mon"
version = "0.1.3"
description = "TUI dashboard for monitoring and merging GitHub pull requests"
readme = "README.md"
authors = [
    { name = "chris", email = "chris.madden@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
]

[project.scripts]
pr-mon = "pr_mon.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
